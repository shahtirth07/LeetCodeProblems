<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Problem Title — Visualization</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ffffff;
    color: #111111;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111111; color: #eeeeee; }
  }
  canvas { max-width: 100%; }
  .controls { display: flex; gap: 0.5rem; }
  .controls button {
    font: inherit;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
  }
  .controls button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
  <canvas id="canvas" width="640" height="360"></canvas>
  <div class="controls">
    <button id="prev">&larr; Prev</button>
    <button id="play">Play</button>
    <button id="next">Next &rarr;</button>
  </div>

  <script>
    // Replace everything below with the step-by-step visualization for this
    // problem. Keep the page self-contained (no local relative imports other
    // than files you also publish in this same visualizations/ folder) so it
    // works when embedded standalone in an <iframe> on the portfolio site.
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const steps = [
      // Build an array of render functions or state snapshots here, one per step.
    ];
    let stepIndex = 0;

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = "16px sans-serif";
      ctx.fillStyle = getComputedStyle(document.body).color;
      ctx.fillText(`Step ${stepIndex + 1} of ${Math.max(steps.length, 1)}`, 20, 30);
      ctx.fillText("Replace this placeholder with real visualization steps.", 20, 60);
    }

    document.getElementById("prev").addEventListener("click", () => {
      stepIndex = Math.max(0, stepIndex - 1);
      render();
    });
    document.getElementById("next").addEventListener("click", () => {
      stepIndex = Math.min(steps.length - 1, stepIndex + 1);
      render();
    });
    document.getElementById("play").addEventListener("click", () => {
      // Hook up autoplay if useful for this visualization.
    });

    render();
  </script>
</body>
</html>
